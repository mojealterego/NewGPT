name: Android CI

on:
  push:
    branches: ["main", "implementation/**", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  rust-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests
        working-directory: rust-core
        run: cargo test --all-targets --release

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
      - name: Build debug AAB
        run: gradle --no-daemon bundleDebug
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: newgpt-android-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
