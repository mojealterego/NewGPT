name: Android CI

on:
  push:
    branches: ["main", "implementation/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble installable release APK
        run: gradle --no-daemon assembleRelease
      - name: Build installable release AAB
        run: gradle --no-daemon bundleRelease
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: newgpt-android-1.0.1-installable
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
