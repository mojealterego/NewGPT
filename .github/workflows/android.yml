name: Android CI

on:
  push:
    branches: ["main", "implementation/**", "mobileappbuilder/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NEWGPT_KEYSTORE_BASE64: ${{ secrets.NEWGPT_KEYSTORE_BASE64 }}
      NEWGPT_RELEASE_STORE_PASSWORD: ${{ secrets.NEWGPT_RELEASE_STORE_PASSWORD }}
      NEWGPT_RELEASE_KEY_ALIAS: ${{ secrets.NEWGPT_RELEASE_KEY_ALIAS }}
      NEWGPT_RELEASE_KEY_PASSWORD: ${{ secrets.NEWGPT_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configure release signing
        if: ${{ env.NEWGPT_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$NEWGPT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/newgpt-release.jks"
          {
            echo "NEWGPT_RELEASE_STORE_FILE=$RUNNER_TEMP/newgpt-release.jks"
            echo "NEWGPT_RELEASE_STORE_PASSWORD=$NEWGPT_RELEASE_STORE_PASSWORD"
            echo "NEWGPT_RELEASE_KEY_ALIAS=$NEWGPT_RELEASE_KEY_ALIAS"
            echo "NEWGPT_RELEASE_KEY_PASSWORD=$NEWGPT_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble release APK
        run: gradle --no-daemon assembleRelease

      - name: Build release AAB
        run: gradle --no-daemon bundleRelease

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Report signing mode
        run: |
          if [ -n "$NEWGPT_RELEASE_STORE_FILE" ]; then
            echo "Release artifacts are signed with the configured CI keystore."
          else
            echo "Release artifacts are unsigned. Configure NEWGPT_KEYSTORE_BASE64 and release credential secrets for signed distribution."
          fi

      - name: Prepare named distribution artifacts
        run: |
          mkdir -p dist
          release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          release_aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          debug_apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$release_apk" && test -n "$release_aab" && test -n "$debug_apk"
          cp "$release_apk" dist/NewGPT-1.4.6-release.apk
          cp "$release_aab" dist/NewGPT-1.4.6-release.aab
          cp "$debug_apk" dist/NewGPT-1.4.6-debug.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NewGPT-1.4.6-Android
          path: dist/*
          if-no-files-found: error
