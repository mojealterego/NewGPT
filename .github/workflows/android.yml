name: Android CI

on:
  push:
    branches: ["main", "implementation/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify stable sideload signing key
        run: keytool -list -keystore app/newgpt-sideload.jks -storepass newgptdev -alias newgpt
      - name: Assemble installable release APK
        run: gradle --no-daemon assembleRelease
      - name: Build installable release AAB
        run: gradle --no-daemon bundleRelease
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Prepare named distribution artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/NewGPT-1.4.4.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/NewGPT-1.4.4.aab
          cp app/build/outputs/apk/debug/app-debug.apk dist/NewGPT-1.4.4-debug.apk
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NewGPT-1.4.4-Android
          path: dist/*
          if-no-files-found: error
